name: Check skill packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r requirements.txt PyYAML
      - run: python scripts/check_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py --out dist/v0.1.0
      - run: python scripts/smoke_packages.py dist/v0.1.0
