name: Bug report
description: A reproducible builder, export or installation failure.
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Command, sanitized input, expected and actual behavior
      description: Prefer the included demo; attach logs without secrets.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, Python, dependencies, agent and commit/version
    validations:
      required: true
