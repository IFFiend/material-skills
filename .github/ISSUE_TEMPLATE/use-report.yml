name: Use report / 使用反馈
description: What did you finish, what failed, and what needed manual correction?
title: "[Use report] "
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options: [campaign-batch, guide-capture, document-batch]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What real task did you try?
      description: Include intended output and audience. Keep client details anonymous.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What did you actually finish?
      description: Attach sanitized examples or reproduce with a demo. Include errors and manual fixes.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Agent/model, OS, Python version and skill version/commit.
  - type: dropdown
    id: repeat
    attributes:
      label: Would you use it for another task?
      options: ["Yes", "With changes described above", "No", "Not sure yet"]
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private client data and unredacted personal information.
          required: true
